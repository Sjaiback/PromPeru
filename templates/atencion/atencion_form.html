{% extends 'base.html' %}{% block content %}
<header class="page-head compact">
  <div>
    <span class="eyebrow">Atención #{{ atencion.pk }}</span>
    <h1>Editar atención</h1>
    <p>Los valores anteriores permanecerán disponibles en auditoría.</p>
  </div>
</header>
<form method="post" class="form-card" novalidate>
  {% csrf_token %}
  <div class="form-grid">
    {% for field in form %}<label
      class="{% if field.name == 'tema_consulta' %}span-2{% endif %}"
      ><span>{{ field.label }}</span>{{ field }}{{ field.errors }}</label
    >{% endfor %}
  </div>
  <div class="form-actions">
    <a class="btn btn-ghost" href="{% url 'atencion:detalle' atencion.pk %}"
      >Cancelar</a
    ><button class="btn btn-primary" type="submit">Guardar cambios</button>
  </div>
</form>
<form
  method="post"
  action="{% url 'atencion:atencion_anular' atencion.pk %}"
  class="danger-zone"
>
  {% csrf_token %}
  <div>
    <strong>Anular atención</strong>
    <p>No desaparece de auditoría.</p>
  </div>
  <button class="btn btn-danger" type="submit">Anular</button>
</form>
{% endblock %}
